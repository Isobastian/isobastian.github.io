<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>@font-face{font-family:"Poppins";font-weight:600;font-display:swap;src:url(/orangle/fonts/poppins-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:800;font-display:swap;src:url(/orangle/fonts/poppins-latin-800-normal.woff2) format("woff2")}
:root{--bg:#061a19;--panel:#0d3330;--line:#174a45;--text:#eef7f5;--muted:#a9c7c2;--orange:#ffb31a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#0a2a28,var(--bg) 40%) fixed;background-color:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.7}
a{color:var(--orange)}a:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{width:min(760px,100% - 32px);margin-inline:auto}
header{border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0}
header a{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;font-size:20px}
header img{width:36px;height:36px;border-radius:9px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:40px 0 8px;font-weight:800}
h2{font-size:22px;margin:36px 0 8px;font-weight:800;color:#fff}
p,li{color:var(--muted)}strong{color:var(--text)}
.meta{color:var(--muted);margin:0 0 24px}
footer{margin-top:56px;border-top:1px solid rgba(255,255,255,.07);padding:24px 0 40px;color:var(--muted);font-size:16px}
footer a{color:var(--text);font-weight:600;text-decoration:none;margin-right:20px}
.card{display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;text-decoration:none;color:var(--text);margin-top:28px;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card img{width:88px;height:88px;border-radius:20px;flex:none}
.card b{display:block;font-size:22px;font-weight:800}.card span{color:var(--muted);font-size:16px}
.card em{font-style:normal;color:var(--orange);font-weight:600;font-size:16px}
</style></head>
<body><main class="wrap" style="padding-top:24px">
<h1>Sebastian Nicosia</h1>
